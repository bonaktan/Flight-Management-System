server {
    listen 8080;
    listen [::]:8080;
    server_name skybridge.bonnybonnybonaktan.xyz;

    # Separate access logs per service
    access_log /var/log/nginx/access_main.log json_combined;

    # Block sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.(env|git|svn|htaccess)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Health check endpoint (no logging)
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Metrics endpoint (stub_status)
    location = /nginx_status {
        stub_status on;
        access_log off;
        allow 172.16.0.0/12; # Docker networks
        allow 10.0.0.0/8;
        deny all;
    }

    # API proxy with rate limiting
    location /api {
        # Don't log health checks
        access_log /var/log/nginx/access_api.log json_combined;

        if ($request_uri = "/api/health") {
            access_log off;
        }

        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        # Request tracing
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Proxy timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Frontend proxy
    location / {
        access_log /var/log/nginx/access_frontend.log json_combined;
        limit_req zone=general_limit burst=50 nodelay;

        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;

        # Request tracing
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Proxy timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}