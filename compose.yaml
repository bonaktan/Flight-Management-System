networks:
    frontend_net:
        driver: bridge
    backend_net:
        driver: bridge

services:
    # --- Frontend Services ---
    cloudflared:
        image: cloudflare/cloudflared:latest
        container_name: skybridge_cloudflared
        command: tunnel run
        environment:
            - TUNNEL_TOKEN=${TUNNEL_TOKEN}
        depends_on:
            - nginx
        networks:
            - frontend_net
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                labels: "service=cloudflared"
        deploy:
            resources:
                limits:
                    cpus: "0.50"
                    memory: 64M
                reservations:
                    cpus: "0.25"
                    memory: 32M
        restart: always
    nginx:
        image: nginx:alpine
        container_name: skybridge_nginx
        ports:
            - 8080:8080
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf:ro
            - skybridge_nginx_logs:/var/log/nginx:rw
        depends_on:
            - backend
            - frontend
        networks:
            - frontend_net
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                labels: "service=nginx"
        deploy:
            resources:
                limits:
                    cpus: "0.50"
                    memory: 64M
                reservations:
                    cpus: "0.25"
                    memory: 32M
        restart: always
    frontend:
        build:
            context: ./
            dockerfile: ./frontend/Dockerfile
        container_name: skybridge_frontend
        expose:
            - "3000"
        networks:
            - frontend_net
        environment:
            - HUSKY=0

        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                labels: "service=frontend"
        deploy:
            resources:
                limits:
                    cpus: "0.50"
                    memory: 128M
                reservations:
                    cpus: "0.25"
                    memory: 64M
        restart: always

    # --- Backend Services ---
    backend:
        build:
            context: ./backend/
            args:
                - POSTGRES_USER=${POSTGRES_USER}
                - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
                - POSTGRES_DB=${POSTGRES_DB}
                - POSTGRES_HOST=${POSTGRES_HOST}
                - POSTGRES_PORT=${POSTGRES_PORT}
        container_name: skybridge_backend
        expose:
            - "8080"
        depends_on:
            - database
        networks:
            - frontend_net
            - backend_net

        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                labels: "service=backend"
        deploy:
            resources:
                limits:
                    cpus: "0.50"
                    memory: 64M
                reservations:
                    cpus: "0.25"
                    memory: 32M
        restart: always
    database:
        image: postgres:18-alpine
        container_name: skybridge_postgres
        ports:
            - 5433:5432
        expose:
            - "5432"
        environment:
            - POSTGRES_USER
            - POSTGRES_PASSWORD
            - POSTGRES_DB
        volumes:
            - skybridge_postgres_data:/var/lib/postgresql
        networks:
            - backend_net
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                labels: "service=postgres"
        deploy:
            resources:
                limits:
                    cpus: "0.50"
                    memory: 256M
                reservations:
                    cpus: "0.25"
                    memory: 32M
        restart: always

volumes:
    skybridge_postgres_data:
    skybridge_nginx_logs:
