    #             labels: "service=nginx"
    #     user: "101:101"  # nginx:nginx user in alpine image
    #     restart: always
    frontend:
        build: ./frontend/
        container_name: skybride_frontend
        ports:
            - 3000:3000
        networks:
            - frontend_net
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                labels: "service=frontend"
        restart: always

    # --- Backend Services ---
    backend:
        build: ./backend/
        container_name: skybridge_backend
        ports:
            - 8080:8080
        depends_on:
            - postgres
        networks:
            - backend_net
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                labels: "service=backend"
        restart: always
    postgres:
        image: postgres:18-alpine
        environment:
            - POSTGRES_USER=${POSTGRES_USER:-user}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
            - POSTGRES_DB=${POSTGRES_DB:-dbname}
        volumes:
            - skybridge_postgres_data:/var/lib/postgresql/data
        networks:
            - frontend_net # WARNING: TEMPORARY
            - backend_net
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                labels: "service=postgres"
        restart: always

volumes:
    skybridge_postgres_data:
    skybridge_nginx_logs:
