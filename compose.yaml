networks:
    frontend_net:
        driver: bridge
    backend_net:
        driver: bridge

services:
    # --- Frontend Services ---
    cloudflared:
        image: cloudflare/cloudflared:latest
        container_name: skybridge_cloudflared
        command: tunnel run
        environment:
            - TUNNEL_TOKEN=${TUNNEL_TOKEN}
        depends_on:
            - nginx
        networks:
            - frontend_net
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                labels: "service=cloudflared"
        deploy:
            resources:
                limits:
                    cpus: "0.50"
                    memory: 64M
                reservations:
                    cpus: "0.25"
                    memory: 32M
        restart: always
    nginx:
        image: nginx:alpine
        container_name: skybridge_nginx
        ports:
            - 8080:8080
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf:ro
            - skybridge_nginx_logs:/var/log/nginx:rw
        depends_on:
            - backend
            - frontend
        networks:
            - frontend_net
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                labels: "service=nginx"
        deploy:
            resources:
                limits:
                    cpus: "0.50"
                    memory: 64M
                reservations:
                    cpus: "0.25"
                    memory: 32M
        restart: always
    frontend:
        build:
            context: ./
            dockerfile: ./frontend/Dockerfile
            args:
                - VITE_BACKEND_URL=${VITE_BACKEND_URL}
        container_name: skybridge_frontend
        expose:
            - "3000"
        networks:
            - frontend_net
        environment:
            - HUSKY=0

        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                labels: "service=frontend"
        deploy:
            resources:
                limits:
                    cpus: "1"
                    memory: 512M
                reservations:
                    cpus: "0.5"
                    memory: 256M
        restart: always

    # --- Backend Services ---
    backend:
        build: ./backend/
        container_name: skybridge_backend
        expose:
            - "8080"
        depends_on:
            - database
        networks:
            - frontend_net
            - backend_net
        environment:
            - DATABASE_USER
            - DATABASE_PASSWORD
            - DATABASE_DB
            - DATABASE_HOST
            - DATABASE_PORT
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                labels: "service=backend"
        deploy:
            resources:
                limits:
                    cpus: "0.50"
                    memory: 64M
                reservations:
                    cpus: "0.25"
                    memory: 32M
        restart: always
    database:
        image: postgres:18-alpine
        container_name: skybridge_postgres
        expose:
            - "5432"
        ports:
            - ${DATABASE_PORT:-5432}:5432
        environment:
            - POSTGRES_USER=${DATABASE_USER:-skybridge}
            - POSTGRES_PASSWORD=${DATABASE_PASSWORD:-skybridge}
            - POSTGRES_DB=${DATABASE_DB:-skybridge}
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-skybridge} -d ${DATABASE_DB:-skybridge}"]
            interval: 5s
            retries: 5
        volumes:
            - skybridge_postgres_data:/var/lib/postgresql
        networks:
            - backend_net
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                labels: "service=postgres"
        deploy:
            resources:
                limits:
                    cpus: "0.50"
                    memory: 256M
                reservations:
                    cpus: "0.25"
                    memory: 32M
        restart: always

    db_migration:
        image: flyway/flyway:10
        container_name: skybridge_db-migration
        command: migrate -X
        volumes:
            - ./sql:/flyway/sql
        environment:
            FLYWAY_URL: jdbc:postgresql://database:5432/${DATABASE_DB:-skybridge}
            FLYWAY_USER: ${DATABASE_USER:-skybridge}
            FLYWAY_PASSWORD: ${DATABASE_PASSWORD:-skybridge}
            FLYWAY_BASELINE_ON_MIGRATE: true
        depends_on:
            database:
                condition: service_healthy
        networks:
            - backend_net
volumes:
    skybridge_postgres_data:
    skybridge_nginx_logs:
